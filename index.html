<div id="news-container" style="font-family: sans-serif; max-width: 800px; margin: 0 auto;">
  <p style="text-align: center; color: #666;">Загрузка новостей...</p>
</div>

<script>
  // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ FIREBASE
  const firebaseUrl = 'ВАША_ССЫЛКА_НА_FIREBASE'; 

  function loadNews() {
    // Запрашиваем новости из облака
    fetch(firebaseUrl + '/news.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('news-container');
        if (!data) {
          container.innerHTML = '<p style="text-align: center; color: #666;">Новостей пока нет</p>';
          return;
        }

        // Превращаем объект в массив и сортируем по времени
        const newsArray = Object.values(data).sort((a, b) => b.time - a.time);
        
        container.innerHTML = newsArray.map(n => `
          <div style="background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); border-left:4px solid #2563eb;">
            <h3 style="margin:0 0 8px; font-size:18px; color:#1e293b;">${n.title}</h3>
            <p style="margin:0 0 12px; font-size:12px; color:#64748b;">${n.author} · ${new Date(n.time).toLocaleDateString('ru-RU')}</p>
            <p style="margin:0; font-size:15px; line-height:1.6; color:#334155; white-space:pre-wrap;">${n.body}</p>
          </div>
        `).join('');
      })
      .catch(err => {
        console.error(err);
        document.getElementById('news-container').innerHTML = '<p style="color: red; text-align: center;">Ошибка загрузки новостей</p>';
      });
  }

  // Загружаем сразу и обновляем каждые 5 секунд
  loadNews();
  setInterval(loadNews, 5000);
</script>
